license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
credits="Nature Rebirth Team"
authors="gloomybanana"

description='''
Nature Rebirth - 自然重生

让Minecraft中那些不可再生资源变得可量产

【核心功能】
• 方解石生成：岩浆在骨块上方流动且相邻蓝冰时转化为方解石
• 凝灰岩生成：岩浆在安山岩上方流动且相邻蓝冰时转化为凝灰岩
• 滴水石生成：岩浆在花岗岩上方流动且相邻蓝冰时转化为滴水石
• 下界岩生成：岩浆周围同时存在蓝冰和岩浆块时转化为下界岩
• 深板岩生成：Y坐标低于阈值时，岩浆遇水生成深板岩变种

【信标增强】
在生成位置下方放置信标，有概率生成稀有矿石：
• 石头/深板岩：煤矿石、铁矿石、红石矿石、青金石矿石、金矿石、绿宝石矿石、钻石矿石
• 下界岩：下界石英矿石、下界金矿石、远古残骸

【龙息相关】
• 龙息合成：龙首+玻璃瓶在工作台合成龙息（龙首不消耗）
• 龙息转化：龙息右键石头/圆石/石砖类方块，转化为对应的末地石版本

【潮涌核心增强】
• 珊瑚生成：在潮涌核心范围内使用骨粉，可在水底方块上随机生成珊瑚和珊瑚扇
• 珊瑚复活：在潮涌核心范围内，失活珊瑚会在1-3秒内自动复活
• 珊瑚合成：珊瑚扇、珊瑚、珊瑚块之间可相互转化

【其他功能】
• 鸡蛋捕获机制：向残血的生物投掷鸡蛋会将目标转化为对应的刷怪蛋
• 自定义规则：通过配置文件添加自定义方块生成规则
• JEI支持：在JEI中查看所有方块的获取方式

【配置文件】
所有功能均可通过配置文件自定义，包括矿石生成概率、功能开关等。
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
